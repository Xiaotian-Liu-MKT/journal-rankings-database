<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>期刊索引室</title>
  <style>
    :root{--ink:#102d28;--ink2:#1d463d;--paper:#f4f0e5;--paper2:#fffdf7;--copper:#a4522d;--gold:#d59a4a;--line:#cfc5b0;--muted:#6e7168;--soft:#e9e1d0;--serif:"Songti SC","STSong","Noto Serif CJK SC",serif;--sans:"Microsoft YaHei UI","PingFang SC",sans-serif}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans)} body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(#7e735c .5px,transparent .7px);background-size:6px 6px;mix-blend-mode:multiply} button,input,select{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .masthead{background:var(--ink);color:#f8f1dd;position:relative;overflow:hidden;padding:37px max(24px,calc((100vw - 1440px)/2)) 31px}.masthead:after{content:"JOURNAL INDEX";position:absolute;right:-14px;bottom:-33px;font:900 clamp(56px,11vw,158px)/1 Georgia,serif;letter-spacing:-8px;color:#29564c;opacity:.55;white-space:nowrap}.brand,.subline{position:relative;z-index:1}.brand{display:flex;align-items:baseline;gap:18px}.brand h1{font:600 clamp(29px,4vw,48px)/1 var(--serif);letter-spacing:.08em;margin:0}.brand b{color:#e3ad66;font:600 11px/1.2 Georgia,serif;letter-spacing:.2em}.subline{max-width:650px;color:#cfdbcd;margin:17px 0 0;font-size:14px}.folio{display:inline-flex;align-items:center;gap:8px;color:#e6b56f;font:11px Georgia,serif;letter-spacing:.12em}.folio:before{content:"";width:28px;height:1px;background:currentColor}
    main{max-width:1440px;margin:auto;padding:28px 24px 48px}.intro{display:flex;justify-content:space-between;gap:25px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:17px}.intro h2{margin:0;font:600 26px/1.2 var(--serif)}.intro p{margin:5px 0 0;color:var(--muted)}.statline{font:600 12px Georgia,serif;letter-spacing:.08em;color:var(--copper);white-space:nowrap}
    .workbench{display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;margin-top:25px}.workbench>*,.workbench section{min-width:0}.filters{border-top:5px solid var(--copper);padding-top:14px}.filters h3{font:600 18px var(--serif);margin:0 0 14px}.filter-group{border-top:1px solid var(--line);padding:13px 0}.filter-group label,.filter-group legend{display:block;font:700 11px/1 var(--sans);letter-spacing:.08em;color:var(--ink2);margin:0 0 8px}.filter-group fieldset{border:0;padding:0;margin:0}.filter-group input,.filter-group select{width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:0;padding:8px;color:var(--ink)}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checkgrid label{margin:0;font-weight:400;font-size:13px;letter-spacing:0;color:var(--muted);cursor:pointer}.checkgrid input{width:auto;accent-color:var(--copper);vertical-align:-2px;margin-right:4px}.filter-actions{display:flex;gap:8px;padding-top:16px}.button{border:1px solid var(--ink);background:var(--ink);color:#fff7e6;padding:9px 14px;font-weight:700}.button:hover{background:var(--ink2)}.button.alt{background:transparent;color:var(--ink)}.button.alt:hover{background:var(--soft)}
    .searchbar{display:grid;grid-template-columns:minmax(200px,1fr) 145px auto;gap:10px;margin-bottom:16px}.searchbar input,.searchbar select{background:var(--paper2);border:1px solid var(--ink);padding:12px}.searchbar input{font-size:15px}.results-head{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:5px solid var(--ink);padding:13px 0 9px}.results-head h3{margin:0;font:600 18px var(--serif)}.results-head span{font-size:12px;color:var(--muted)}.export{color:var(--copper);font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}.export:hover{color:var(--ink)}
    .table-wrap{overflow:auto;border:1px solid var(--line);background:var(--paper2);max-height:calc(100vh - 240px)}table{border-collapse:collapse;width:100%;min-width:960px}thead{position:sticky;top:0;z-index:2;background:#e4dcc9;box-shadow:0 1px var(--line)}th{text-align:left;padding:10px 12px;font:700 10px var(--sans);letter-spacing:.08em;color:var(--ink2);white-space:nowrap}th:first-child,td:first-child{width:28%;min-width:275px}th button{border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;padding:0}th button:hover{text-decoration:underline}td{padding:10px 12px;border-top:1px solid #e6e0d3;vertical-align:top;color:#343d38}tbody tr{transition:background .15s}tbody tr:hover{background:#faf2df}.journal-btn{appearance:none;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font:600 15px/1.3 var(--serif);cursor:pointer}.journal-btn:hover{text-decoration:underline;color:var(--copper)}.issn{display:block;color:var(--muted);font:11px ui-monospace,monospace;margin-top:3px}.badges{display:flex;gap:3px;flex-wrap:wrap}.badge{display:inline-block;border:1px solid currentColor;border-radius:12px;padding:1px 6px;font:700 10px/1.35 var(--sans);white-space:nowrap}.q1{color:#557e29}.q2{color:#8a6829}.q3{color:#9b5e36}.q4{color:#81555b}.dark{color:#245d53}.star{color:#a4522d}.na{color:#b2aca1}.num{font-variant-numeric:tabular-nums;white-space:nowrap}.subjects{max-width:270px;color:#59625b;font-size:12px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.loading,.empty{padding:35px;text-align:center;color:var(--muted);font:italic 16px var(--serif)}.pager{display:flex;justify-content:space-between;align-items:center;padding:15px 0}.pager span{color:var(--muted);font-size:12px}.pager button:disabled{opacity:.35;cursor:not-allowed}
    dialog{border:0;padding:0;max-width:min(760px,95vw);width:760px;background:var(--paper2);color:var(--ink);box-shadow:0 18px 80px #001a1466}dialog::backdrop{background:#05282199}.drawer-head{background:var(--ink);color:#fff7e6;padding:25px 30px;display:flex;justify-content:space-between;gap:20px}.drawer-head h2{font:600 27px/1.2 var(--serif);margin:0}.drawer-close{border:1px solid #d1b779;background:transparent;color:#fff7e6;width:33px;height:33px;font-size:22px;line-height:1}.drawer-body{padding:24px 30px 34px;max-height:70vh;overflow:auto}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 24px}.profile div{background:var(--paper2);padding:10px}.profile b{display:block;color:var(--muted);font-size:10px;letter-spacing:.07em}.profile span{font-weight:700}.history h3{font:600 20px var(--serif);margin:20px 0 8px}.observation{border-top:1px solid var(--line);padding:13px 0}.obs-top{display:flex;justify-content:space-between;gap:16px}.obs-top b{font:700 12px var(--sans);letter-spacing:.05em;color:var(--copper)}.obs-top small{color:var(--muted)}.metric-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.metric-list span{background:var(--soft);padding:2px 6px;font-size:12px}.source-note{border-left:3px solid var(--gold);padding:10px 13px;background:#fff9e9;color:#665e50;font-size:12px}
    footer{margin-top:36px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px}footer summary{cursor:pointer;color:var(--ink);font-weight:700;padding:4px 0}.source-list{margin:6px 0;padding-left:16px}.raw{margin-top:10px}.raw summary{font-size:12px}.raw pre{white-space:pre-wrap;word-break:break-word;background:#eee8db;border:1px solid var(--line);padding:9px;font:11px/1.45 ui-monospace,monospace;color:#3a443d}@media(max-width:800px){.masthead{padding:28px 20px}.brand{flex-direction:column;align-items:flex-start;gap:8px}.brand h1{white-space:nowrap}.workbench{grid-template-columns:minmax(0,1fr)}.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}.filters h3,.filter-actions{grid-column:1/-1}.searchbar{grid-template-columns:minmax(0,1fr)}.intro{align-items:start;flex-direction:column}.table-wrap{max-height:none}.drawer-body{padding:20px}.drawer-head{padding:20px}.profile{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header class="masthead"><div class="brand"><h1>期刊索引室</h1><b>JOURNAL REFERENCE DESK</b></div><p class="subline"><span class="folio">LOCAL EDITION</span><br>将多个期刊评价体系置于一张可检索的书目卡中。每一条记录都可回溯到导入来源与版本。</p></header>
  <main>
    <section class="intro"><div><h2>查找刊物，比较指标，保留出处。</h2><p>刊名、ISSN、评级与学科可以组合检索。空白可能表示来源未给出或不同来源冲突；名单未匹配不等于零。本地原始数据也含非期刊出版物。</p></div><div class="statline" id="statline">正在读取索引…</div></section>
    <div class="workbench">
      <aside class="filters" aria-label="组合筛选"><h3>索引条件</h3>
        <div class="filter-group"><label for="abdc">ABDC 分级</label><select id="abdc" data-param="abdc"><option value="">全部</option><option>A*</option><option>A</option><option>B</option><option>C</option></select></div>
        <div class="filter-group"><label for="ajg">AJG / ABS 2024</label><select id="ajg" data-param="ajg"><option value="">全部</option><option>4*</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
        <div class="filter-group"><label for="cas">中科院分区</label><select id="cas" data-param="cas"><option value="">全部</option><option value="1">1 区</option><option value="2">2 区</option><option value="3">3 区</option><option value="4">4 区</option></select></div>
        <div class="filter-group"><label for="jcr_quartile">JCR 分区</label><select id="jcr_quartile" data-param="jcr_quartile"><option value="">全部</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></div>
        <div class="filter-group"><label for="sjr_quartile">SJR 分区</label><select id="sjr_quartile" data-param="sjr_quartile"><option value="">全部</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></div>
        <div class="filter-group"><label for="subject">学科关键词</label><input id="subject" data-param="subject" placeholder="如 Management、Oncology"></div>
        <div class="filter-group"><label for="source_type">SJR 出版物类型</label><select id="source_type" data-param="source_type"><option value="">全部（仅有 SJR 类型的条目）</option><option value="journal">期刊</option><option value="book series">丛书</option><option value="conference and proceedings">会议与论文集</option><option value="trade journal">行业期刊</option></select></div>
        <div class="filter-group"><label for="min_if">最低 JIF</label><input id="min_if" data-param="min_if" type="number" min="0" step="0.1" placeholder="如 5"></div>
        <div class="filter-group"><fieldset><legend>名单收录</legend><div class="checkgrid"><label><input id="ft50" data-param="ft50" type="checkbox">FT50</label><label><input id="utd24" data-param="utd24" type="checkbox">UTD24</label></div></fieldset></div>
        <div class="filter-actions"><button class="button" id="apply" type="button">应用筛选</button><button class="button alt" id="clear" type="button">清除</button></div>
      </aside>
      <section aria-live="polite">
        <form class="searchbar" id="searchform"><input id="q" data-param="q" autocomplete="off" placeholder="搜索刊名或 ISSN" aria-label="搜索刊名或 ISSN"><select id="sort" data-param="sort" aria-label="排序方式"><option value="title">按刊名排序</option><option value="impact_factor">按 JIF 排序</option><option value="sjr">按 SJR 排序</option></select><button class="button" type="submit">检索</button></form>
        <div class="results-head"><div><h3>检索结果</h3><span id="result-summary">准备就绪</span></div><a class="export" id="export-link" href="/api/export.csv">导出当前结果 CSV</a></div>
        <div class="table-wrap"><table><thead><tr><th><button data-sort="title">期刊名</button></th><th>评级 / 名单</th><th><button data-sort="impact_factor">JIF</button></th><th>JCR 最佳分区</th><th><button data-sort="sjr">SJR</button></th><th>中科院</th><th>学科</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="loading">正在读取…</td></tr></tbody></table></div>
        <nav class="pager" aria-label="结果翻页"><button class="button alt" id="prev" type="button">上一页</button><span id="page-label">—</span><button class="button alt" id="next" type="button">下一页</button></nav>
      </section>
    </div>
    <footer><details><summary>数据范围与来源说明</summary><div id="notes">来源说明读取中…</div><ul class="source-list" id="source-list"></ul></details></footer>
  </main>
  <dialog id="detail"><div class="drawer-head"><h2 id="detail-title">期刊详情</h2><button class="drawer-close" id="close-detail" aria-label="关闭详情">×</button></div><div class="drawer-body" id="detail-body"></div></dialog>
  <script src="static-client.js"></script>
  <script>
  (()=>{
    'use strict'; const $=s=>document.querySelector(s), qs=(o)=>Object.entries(o).filter(([,v])=>v!==''&&v!==false&&v!=null).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v===true?1:v)}`).join('&');
    const state={offset:0,limit:50,sort:'title',order:'asc',total:0,requestId:0,controller:null}; const params=()=>{const x={limit:state.limit,offset:state.offset,sort:state.sort,order:state.order};document.querySelectorAll('[data-param]').forEach(el=>{const v=el.type==='checkbox'?el.checked:el.value.trim();if(v)x[el.dataset.param]=v});return x};
    const text=(node,value)=>node.append(document.createTextNode(value==null?'—':String(value))); const el=(tag,attrs={},content)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2).toLowerCase(),v);else n.setAttribute(k,v)}if(content!=null)text(n,content);return n};
    const badge=(v,kind='')=>v==null||v===''?el('span',{class:'na'},'—'):el('span',{class:`badge ${kind||String(v).toLowerCase()}`},v); const display=(v)=>v==null||v===''?'—':v;
    function cell(node){const td=el('td');td.append(node);return td} function rating(r){const wrap=el('div',{class:'badges'});if(r.abdc)wrap.append(badge(`ABDC 2025 ${r.abdc}`,r.abdc.includes('*')?'star':''));if(r.ajg)wrap.append(badge(`AJG 2024 ${r.ajg}`,r.ajg.includes('*')?'star':''));if(r.ft50===true)wrap.append(badge('FT50','dark'));if(r.utd24===true)wrap.append(badge('UTD24','dark'));if(!wrap.childNodes.length)wrap.append(el('span',{class:'na'},'本地无当前评级'));return wrap}
    function render(data){state.total=data.total||0;const rows=$('#rows');rows.replaceChildren();if(!data.results?.length){const tr=el('tr');tr.append(el('td',{colspan:'7',class:'empty'},'没有符合条件的本地记录。'));rows.append(tr)}else data.results.forEach(r=>{const tr=el('tr');const title=el('button',{class:'journal-btn',type:'button',onClick:()=>detail(r.journal_id)},r.title);const titleCell=cell(title); if(r.issns?.length) titleCell.append(el('span',{class:'issn'},r.issns.join(' · ')));const subjects=r.subjects?.join('；')||'—';tr.append(titleCell,cell(rating(r)),cell(el('span',{class:'num'},display(r.impact_factor))),cell(badge(r.jcr_quartile)),cell(el('span',{class:'num'},`${display(r.sjr)}${r.sjr_quartile?' · '+r.sjr_quartile:''}`)),cell(r.cas_zone?el('span',{},`${r.cas_zone} 区${r.cas_top?' · Top':''}`):el('span',{class:'na'},'—')),cell(el('span',{class:'subjects',title:subjects},subjects)));rows.append(tr)}); const start=state.total?state.offset+1:0,end=Math.min(state.offset+state.limit,state.total);$('#result-summary').textContent=`显示 ${start}–${end} 条，共 ${state.total.toLocaleString()} 条`;$('#page-label').textContent=state.total?`第 ${Math.floor(state.offset/state.limit)+1} 页 / 共 ${Math.ceil(state.total/state.limit)} 页`:'—';$('#prev').disabled=state.offset===0;$('#next').disabled=state.offset+state.limit>=state.total; $('#export-link').href='/api/export.csv?'+qs(params())}
    function setUnavailable(message){const tr=el('tr');tr.append(el('td',{colspan:'7',class:'empty'},message));$('#rows').replaceChildren(tr);$('#result-summary').textContent='无法显示结果';$('#prev').disabled=true;$('#next').disabled=true;const x=$('#export-link');x.removeAttribute('href');x.setAttribute('aria-disabled','true');x.style.pointerEvents='none';x.style.opacity='.45'}
    async function load(reset=false){if(reset)state.offset=0;if(state.controller)state.controller.abort();state.controller=new AbortController();const requestId=++state.requestId;$('#rows').replaceChildren(el('tr',{},null));$('#rows tr').append(el('td',{colspan:'7',class:'loading'},'正在检索索引…'));try{const res=await fetch('/api/journals?'+qs(params()),{signal:state.controller.signal});const payload=await res.json().catch(()=>({}));if(requestId!==state.requestId)return;if(!res.ok)throw Error(payload.error||payload.message||`服务器返回 ${res.status}`);render(payload);$('#export-link').style.pointerEvents='';$('#export-link').style.opacity='';$('#export-link').removeAttribute('aria-disabled')}catch(e){if(e.name==='AbortError'||requestId!==state.requestId)return;setUnavailable(e.message||'无法连接本地查询服务。请通过启动脚本打开此页面。')}}
    function metricChips(obj){const f=document.createDocumentFragment();Object.entries(obj||{}).forEach(([k,v])=>{if(v===null||v==='')return;if(Array.isArray(v)){v.forEach((item,i)=>{const value=typeof item==='object'?Object.entries(item).filter(([,z])=>z!==null&&z!=='').map(([a,z])=>`${a}: ${z}`).join('；'):item;f.append(el('span',{},`${k}${v.length>1?' '+(i+1):''}: ${value}`))});return}if(typeof v==='object'){f.append(el('span',{},`${k}: ${Object.entries(v).filter(([,z])=>z!==null&&z!=='').map(([a,z])=>`${a}: ${z}`).join('；')}`));return}f.append(el('span',{},`${k}: ${v}`))});return f}
    async function detail(id){const dialog=$('#detail'),body=$('#detail-body');body.replaceChildren(el('div',{class:'loading'},'正在读取来源记录…'));dialog.showModal();try{const res=await fetch('/api/journals/'+encodeURIComponent(id));const d=await res.json().catch(()=>({}));if(!res.ok)throw Error(d.error||d.message||res.status);const j=d.journal;$('#detail-title').textContent=j.title;const profile=el('div',{class:'profile'});[['ISSN',(j.issns||[]).join(' · ')||'—'],['出版商',j.publisher??'—'],['国家 / 地区',j.country??'—'],['ABDC 2025',j.abdc??'—'],['AJG 2024',j.ajg??'—'],['JIF',j.impact_factor??'—'],['JCR 最佳分区',j.jcr_quartile??'—'],['SJR',j.sjr??'—'],['中科院',j.cas_zone!=null?`${j.cas_zone} 区`:'—']].forEach(([k,v])=>{const x=el('div');x.append(el('b',{},k),el('span',{},v));profile.append(x)});body.replaceChildren(profile);if(d.aliases?.length){const a=el('p',{class:'source-note'},'别名：'+d.aliases.join('；'));body.append(a)}const history=el('section',{class:'history'});history.append(el('h3',{},'来源与版本记录'));if(!d.observations?.length)history.append(el('p',{},'暂无可显示的来源记录。'));else d.observations.forEach(o=>{const item=el('article',{class:'observation'}),top=el('div',{class:'obs-top'});top.append(el('b',{},[o.system,o.edition,o.metric_year].filter(Boolean).join(' · ')),el('small',{},`${o.source_file||o.source_id||'来源'}${o.source_sheet?' / '+o.source_sheet:''}${o.source_row?' / 第 '+o.source_row+' 行':''}`));item.append(top,el('div',{},`原刊名：${o.title??'—'}；匹配方式：${o.match_method??'—'}`));const chips=el('div',{class:'metric-list'});chips.append(metricChips(o.metrics));item.append(chips);if(o.quality_flags?.length){item.append(el('p',{class:'source-note'},`质量提示：${o.quality_flags.join('；')}`))}const raw=el('details',{class:'raw'});raw.append(el('summary',{},'查看原始字段'));raw.append(el('pre',{},JSON.stringify(o.raw??{},null,2)));item.append(raw);history.append(item)});body.append(history)}catch(e){body.replaceChildren(el('div',{class:'empty'},`无法读取该条目的详情：${e.message||'服务器错误'}`))}}
    async function meta(){try{const r=await fetch('/api/meta');if(!r.ok)throw Error();const d=await r.json(),s=d.stats||{};$('#statline').textContent=`${(s.journals||0).toLocaleString()} PUBLICATIONS · ${(s.records||0).toLocaleString()} SOURCE RECORDS`;$('#notes').textContent=(d.notes||[]).join('　');const list=$('#source-list');list.replaceChildren();(d.sources||[]).filter(x=>!x.duplicate_of).forEach(x=>list.append(el('li',{},`${x.system||'来源'} ${x.edition||''}：${x.filename||x.source_id}（${(x.row_count||0).toLocaleString()} 条）`)))}catch(e){$('#statline').textContent='本地数据集';$('#notes').textContent='该页面需通过本地查询服务访问。'}}
    window.addEventListener('journal-static-progress',event=>{const message=event.detail?.message;if(message)$('#result-summary').textContent=message});$('#searchform').addEventListener('submit',e=>{e.preventDefault();load(true)});$('#apply').addEventListener('click',()=>load(true));$('#clear').addEventListener('click',()=>{document.querySelectorAll('[data-param]').forEach(x=>{if(x.type==='checkbox')x.checked=false;else if(x.id==='sort')x.value='title';else x.value=''});state.sort='title';state.order='asc';load(true)});document.querySelectorAll('th [data-sort]').forEach(b=>b.addEventListener('click',()=>{const x=b.dataset.sort;state.order=state.sort===x&&state.order==='asc'?'desc':'asc';state.sort=x;$('#sort').value=x;load(true)}));$('#sort').addEventListener('change',e=>{state.sort=e.target.value;state.order='asc';load(true)});$('#prev').addEventListener('click',()=>{state.offset=Math.max(0,state.offset-state.limit);load()});$('#next').addEventListener('click',()=>{state.offset+=state.limit;load()});$('#close-detail').addEventListener('click',()=>$('#detail').close());$('#detail').addEventListener('click',e=>{if(e.target===$('#detail'))$('#detail').close()}); meta();load();
  })();
  </script>
</body>
</html>
